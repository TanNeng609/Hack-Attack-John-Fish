<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisAI - Browser Preview Dashboard</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="src/index.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React and ReactDOM CDNs (v18) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel CDN for compiling JSX in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- React Mount Root -->
    <div id="root">
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; background:#070913; color:#94a3b8; font-family:sans-serif;">
            <i class="fa-solid fa-circle-notch fa-spin" style="font-size:2rem; margin-right:1rem; color:#00f2fe;"></i>
            <span>Compiling and rendering AegisAI React app...</span>
        </div>
    </div>

    <!-- React Application Code (Bypasses CORS restrictions) -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ================= Sidebar Component =================
        function Sidebar({ activeTab, setActiveTab }) {
          return (
            <aside className="sidebar">
              <div className="brand-section">
                <div className="brand-logo">Æ</div>
                <div className="brand-name">AegisAI</div>
              </div>
              
              <nav className="menu-section">
                <button 
                  className={`menu-item ${activeTab === 'overview' ? 'active' : ''}`}
                  onClick={() => setActiveTab('overview')}
                >
                  <i className="fa-solid fa-chart-line"></i>
                  <span>Overview</span>
                </button>
                <button 
                  className={`menu-item ${activeTab === 'it-prediction' ? 'active' : ''}`}
                  onClick={() => setActiveTab('it-prediction')}
                >
                  <i className="fa-solid fa-server"></i>
                  <span>IT Prediction</span>
                </button>
                <button 
                  className={`menu-item ${activeTab === 'financial-risk' ? 'active' : ''}`}
                  onClick={() => setActiveTab('financial-risk')}
                >
                  <i className="fa-solid fa-shield-halved"></i>
                  <span>Financial Risk</span>
                </button>
                <button 
                  className={`menu-item ${activeTab === 'remediation' ? 'active' : ''}`}
                  onClick={() => setActiveTab('remediation')}
                >
                  <i className="fa-solid fa-terminal"></i>
                  <span>Remediation</span>
                </button>
                <button 
                  className={`menu-item ${activeTab === 'hardware-degradation' ? 'active' : ''}`}
                  onClick={() => setActiveTab('hardware-degradation')}
                >
                  <i className="fa-solid fa-microchip"></i>
                  <span>Hardware Degradation</span>
                </button>
                <button 
                  className={`menu-item ${activeTab === 'settings' ? 'active' : ''}`}
                  onClick={() => setActiveTab('settings')}
                >
                  <i className="fa-solid fa-sliders"></i>
                  <span>Settings</span>
                </button>
              </nav>
              
              <div className="sidebar-footer">
                <div className="system-status">
                  <span className="status-label">Engine Status:</span>
                  <span className="status-indicator">
                    <span className="status-dot"></span>
                    <span>Active</span>
                  </span>
                </div>
              </div>
            </aside>
          );
        }

        // ================= Overview Dashboard Component =================
        function Overview({ alerts, setAlerts }) {
          const [systemHealth, setSystemHealth] = useState(98.4);
          const [threatIndex, setThreatIndex] = useState(12);
          const [anomalyRate, setAnomalyRate] = useState(0.04);
          const [costSaved, setCostSaved] = useState(48200);

          const chartRef = useRef(null);
          const chartInstance = useRef(null);

          const telemetryHistory = useRef({
            labels: [],
            cpu: [],
            failedTx: []
          });

          const activeAnomaly = useRef(null);

          if (telemetryHistory.current.labels.length === 0) {
            const now = new Date();
            for (let i = 9; i >= 0; i--) {
              const timeStr = new Date(now.getTime() - i * 5000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
              telemetryHistory.current.labels.push(timeStr);
              telemetryHistory.current.cpu.push(Math.floor(Math.random() * 20) + 30);
              telemetryHistory.current.failedTx.push(parseFloat((Math.random() * 0.4 + 0.1).toFixed(2)));
            }
          }

          useEffect(() => {
            if (chartRef.current) {
              const ctx = chartRef.current.getContext('2d');
              chartInstance.current = new Chart(ctx, {
                type: 'line',
                data: {
                  labels: telemetryHistory.current.labels,
                  datasets: [
                    {
                      label: 'System CPU Load (%)',
                      data: telemetryHistory.current.cpu,
                      borderColor: '#00f2fe',
                      borderWidth: 2,
                      backgroundColor: 'rgba(0, 242, 254, 0.05)',
                      fill: true,
                      tension: 0.35,
                      yAxisID: 'y'
                    },
                    {
                      label: 'Transaction Failure Rate (%)',
                      data: telemetryHistory.current.failedTx,
                      borderColor: '#ff3838',
                      borderWidth: 2,
                      backgroundColor: 'rgba(255, 56, 56, 0.05)',
                      fill: true,
                      tension: 0.35,
                      yAxisID: 'y1'
                    }
                  ]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  scales: {
                    x: {
                      grid: { color: 'rgba(255, 255, 255, 0.03)' },
                      ticks: { color: '#64748b', font: { family: 'Fira Code', size: 9 } }
                    },
                    y: {
                      position: 'left',
                      min: 0,
                      max: 100,
                      grid: { color: 'rgba(255, 255, 255, 0.03)' },
                      ticks: { color: '#64748b' },
                      title: {
                        display: true,
                        text: 'CPU Load (%)',
                        color: '#64748b',
                        font: { family: 'Outfit', size: 10 }
                      }
                    },
                    y1: {
                      position: 'right',
                      min: 0,
                      max: 25,
                      grid: { drawOnChartArea: false },
                      ticks: { color: '#64748b' },
                      title: {
                        display: true,
                        text: 'Tx Failure Rate (%)',
                        color: '#64748b',
                        font: { family: 'Outfit', size: 10 }
                      }
                    }
                  },
                  plugins: {
                    legend: {
                      labels: { color: '#94a3b8', font: { family: 'Outfit', weight: '500' } }
                    }
                  }
                }
              });
            }

            return () => {
              if (chartInstance.current) {
                chartInstance.current.destroy();
              }
            };
          }, []);

          useEffect(() => {
            const telemetryInterval = setInterval(() => {
              const hasAnomaly = activeAnomaly.current === 'it';
              let baseCpu = hasAnomaly ? 94 : 38;
              let baseFailedTx = hasAnomaly ? 16.8 : 0.25;

              let cpu = Math.max(0, Math.min(100, Math.floor(baseCpu + (Math.random() * 10 - 5))));
              let failedTx = Math.max(0, parseFloat((baseFailedTx + (Math.random() * 2 - 1)).toFixed(2)));

              const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
              
              telemetryHistory.current.labels.push(timeStr);
              telemetryHistory.current.cpu.push(cpu);
              telemetryHistory.current.failedTx.push(failedTx);

              if (telemetryHistory.current.labels.length > 10) {
                telemetryHistory.current.labels.shift();
                telemetryHistory.current.cpu.shift();
                telemetryHistory.current.failedTx.shift();
              }

              if (!hasAnomaly) {
                setSystemHealth(parseFloat((98.5 + Math.random() * 1.0).toFixed(1)));
                setThreatIndex(Math.floor(6 + Math.random() * 5));
                setAnomalyRate(parseFloat((0.02 + Math.random() * 0.05).toFixed(2)));
              } else {
                setSystemHealth(74.5);
                setThreatIndex(91);
                setAnomalyRate(16.8);
              }

              const countEl = document.getElementById("active-alerts-count");
              if (countEl) {
                countEl.textContent = alerts.filter(a => a.type === "danger").length;
              }

              if (chartInstance.current) {
                chartInstance.current.update('none');
              }
            }, 2500);

            const anomalyInterval = setInterval(() => {
              if (activeAnomaly.current) return;

              const triggerChance = Math.random();
              if (triggerChance > 0.4) {
                activeAnomaly.current = 'it';
                
                const newAlert = {
                  id: "alert-it-" + Date.now(),
                  type: "danger",
                  tag: "CROSS-DOMAIN RISK",
                  time: "Just Now",
                  title: "Infrastructure Spike Impacting Checkout API",
                  desc: "Thread exhaustion on <strong>user-service</strong> (CPU: 94%) is blocking database read locks, resulting in <strong>16.8% payment checkout failures</strong>.",
                  xai: "Correlated Risk Inference: (1) user-service connection timeouts spiked. (2) Database threads saturated at 100%. (3) Checkout API transaction failure rate increased from 0.25% to 16.8% (99.9% anomaly percentile). Expected business loss: $9,000/minute. Action required: Scale replicas and flush connections.",
                  expanded: false
                };

                setAlerts(prev => [newAlert, ...prev]);
              }
            }, 18000);

            return () => {
              clearInterval(telemetryInterval);
              clearInterval(anomalyInterval);
            };
          }, [alerts]);

          const toggleAlert = (alertId) => {
            setAlerts(prev => prev.map(alert => 
              alert.id === alertId ? { ...alert, expanded: !alert.expanded } : alert
            ));
          };

          const resetAnomaly = () => {
            if (!activeAnomaly.current) return;

            const resolutionAlert = {
              id: "alert-res-" + Date.now(),
              type: "success",
              tag: "REMEDIATION",
              time: "Just Now",
              title: "Cross-Domain Telemetry Normalized",
              desc: "Autoscaled pods and cleared cache connections. CPU Load returned to 38%. Payment checkout failure rate restored to 0.25%.",
              xai: "System auto-check passed. Database connections cleared. Checked transaction endpoints and returned HTTP 200 OK. Prevented potential additional loss of $18,000.",
              expanded: false
            };

            setAlerts(prev => [resolutionAlert, ...prev]);
            activeAnomaly.current = null;
            setSystemHealth(99.6);
            setThreatIndex(8);
            setAnomalyRate(0.04);
            setCostSaved(prev => prev + 18000);
          };

          const activeAlertsCount = alerts.filter(a => a.type === "danger").length;

          return (
            <div className="overview-page">
              <div className="grid-stats">
                <div className="card-stat success">
                  <div className="stat-header">
                    <span>SYSTEM HEALTH</span>
                    <i className="fa-solid fa-heart-pulse stat-icon"></i>
                  </div>
                  <div className="stat-value">{systemHealth}%</div>
                  <div className="stat-footer">
                    <span className="trend-up"><i className="fa-solid fa-arrow-up"></i> +0.4%</span>
                    <span>vs last hour</span>
                  </div>
                </div>

                <div className="card-stat primary">
                  <div className="stat-header">
                    <span>INCIDENT THREAT INDEX</span>
                    <i className="fa-solid fa-triangle-exclamation stat-icon"></i>
                  </div>
                  <div className="stat-value">{threatIndex}%</div>
                  <div className="stat-footer">
                    <span className={`trend-${threatIndex > 50 ? 'up' : 'down'}`}>
                      <i className={`fa-solid fa-arrow-${threatIndex > 50 ? 'up' : 'down'}`}></i> 
                      {threatIndex > 50 ? ' +78%' : ' -6.2%'}
                    </span>
                    <span>vs yesterday</span>
                  </div>
                </div>

                <div className="card-stat danger">
                  <div className="stat-header">
                    <span>TX ANOMALY RATE</span>
                    <i className="fa-solid fa-money-bill-trend-up stat-icon"></i>
                  </div>
                  <div className="stat-value" style={{ color: anomalyRate > 1.0 ? 'var(--color-danger)' : 'var(--text-primary)' }}>
                    {anomalyRate}%
                  </div>
                  <div className="stat-footer">
                    <span>Payment checkout stream</span>
                  </div>
                </div>

                <div className="card-stat success" style={{ cursor: activeAnomaly.current ? 'pointer' : 'default', borderLeft: '4px solid var(--color-success)' }} onClick={resetAnomaly}>
                  <div className="stat-header">
                    <span>DOWNTIME COST AVOIDED</span>
                    <i className="fa-solid fa-wallet stat-icon" style={{ color: 'var(--color-success)' }}></i>
                  </div>
                  <div className="stat-value">${costSaved.toLocaleString()} USD</div>
                  <div className="stat-footer">
                    {activeAnomaly.current ? (
                      <span className="trend-down" style={{ fontWeight: '700', textDecoration: 'underline' }}>
                        Auto-Fix to save $18,000
                      </span>
                    ) : (
                      <span className="trend-up">
                        Clean operation today
                      </span>
                    )}
                  </div>
                </div>
              </div>

              <div className="grid-2col">
                <div className="card-panel">
                  <div className="panel-header">
                    <div>
                      <h3 className="panel-title">
                        <i className="fa-solid fa-circle-nodes" style={{ color: "var(--color-primary)" }}></i> Operational & Financial Data Correlation
                      </h3>
                      <p className="panel-subtitle">Tracking system CPU Load against failed checkout transactions (Cross-Domain Telemetry)</p>
                    </div>
                    <div className="panel-actions">
                      <span className="live-badge"><span className="live-dot"></span>LIVE</span>
                    </div>
                  </div>
                  <div className="chart-container">
                    <canvas ref={chartRef}></canvas>
                  </div>
                </div>

                <div className="card-panel">
                  <div className="panel-header">
                    <div>
                      <h3 className="panel-title">
                        <i className="fa-solid fa-bullseye" style={{ color: "var(--color-danger)" }}></i> Aegis AI Cross-Domain Alerts
                      </h3>
                      <p className="panel-subtitle">Click alert cards to view AI Diagnostic Inferences and estimated losses</p>
                    </div>
                  </div>
                  <div className="alerts-list">
                    {alerts.map((alert) => (
                      <div 
                        key={alert.id} 
                        className={`alert-item ${alert.type} ${alert.expanded ? 'expanded' : ''}`}
                        onClick={() => toggleAlert(alert.id)}
                      >
                        <div className="alert-meta">
                          <span className="alert-tag">{alert.tag}</span>
                          <span className="alert-time">{alert.time}</span>
                        </div>
                        <h4 className="alert-title">{alert.title}</h4>
                        <p className="alert-desc" dangerouslySetInnerHTML={{ __html: alert.desc }}></p>
                        
                        {alert.expanded && (
                          <div className="alert-xai" onClick={(e) => e.stopPropagation()}>
                            <div className="xai-title">
                              <i className="fa-solid fa-brain"></i> Explainable AI Diagnostic Inference
                            </div>
                            <div className="xai-body">
                              {alert.xai}
                            </div>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          );
        }

        // ================= Blank Page Placeholders =================
        function ITPrediction({ setActiveTab }) {
          const [isSimulating, setIsSimulating] = useState(false);
          const [simulationStep, setSimulationStep] = useState(0);
          const [selectedNode, setSelectedNode] = useState(null);
          const [logs, setLogs] = useState([]);
          
          const [nodes, setNodes] = useState({
            api: 'healthy',
            user: 'healthy',
            payment: 'healthy',
            db: 'healthy'
          });

          const [models, setModels] = useState({
            thread: 2,
            memory: 1,
            network: 5
          });

          const logsEndRef = useRef(null);

          useEffect(() => {
            if (logsEndRef.current) {
              logsEndRef.current.scrollIntoView({ behavior: 'smooth' });
            }
          }, [logs]);

          useEffect(() => {
            const initialLogs = [
              { id: 1, type: 'info', text: '[system] AegisAI IT Predictive Engine initialized.' },
              { id: 2, type: 'info', text: '[api-gateway] Listening on port 443.' },
              { id: 3, type: 'info', text: '[user-service] Connected to db-cluster-primary.' },
              { id: 4, type: 'info', text: '[payment-gateway] Stripe webhook active.' },
              { id: 5, type: 'info', text: '[predictive-model] Baseline established. Monitoring...' },
            ];
            setLogs(initialLogs);
          }, []);

          useEffect(() => {
            let interval;
            if (!isSimulating) {
              interval = setInterval(() => {
                const endpoints = ['/api/v1/users', '/api/v1/health', '/auth/verify'];
                const ep = endpoints[Math.floor(Math.random() * endpoints.length)];
                const latency = Math.floor(Math.random() * 20) + 10;
                addLog('info', `[api-gateway] GET ${ep} 200 OK - ${latency}ms`);
              }, 3000);
            }
            return () => clearInterval(interval);
          }, [isSimulating]);

          useEffect(() => {
            if (!isSimulating) return;

            const sequence = [
              {
                delay: 1000,
                action: () => {
                  setSimulationStep(1);
                  addLog('warning', '[user-service] WARN: Incoming request rate spiked by 400%');
                  setNodes(prev => ({ ...prev, api: 'warning' }));
                  setModels(prev => ({ ...prev, network: 45 }));
                }
              },
              {
                delay: 3000,
                action: () => {
                  setSimulationStep(2);
                  addLog('warning', '[user-service] WARN: Thread pool utilization at 85%');
                  addLog('highlight', '[predictive-model] Anomaly Detected: user-service thread pool filling faster than GC cycle.', { xai: 'Flagged: 400% deviation from historical baseline tensor for this time of day.' });
                  setNodes(prev => ({ ...prev, user: 'warning' }));
                  setModels(prev => ({ ...prev, thread: 68 }));
                }
              },
              {
                delay: 5500,
                action: () => {
                  setSimulationStep(3);
                  addLog('error', '[db-cluster] ERROR: Connection timeout from user-service (max connections reached)');
                  setNodes(prev => ({ ...prev, db: 'warning' }));
                  setModels(prev => ({ ...prev, thread: 82 }));
                }
              },
              {
                delay: 8000,
                action: () => {
                  setSimulationStep(4);
                  addLog('error', '[user-service] CRITICAL: Thread Exhaustion (OOM). Service unresponsive.');
                  addLog('error', '[payment-gateway] ERROR: Upstream user-service failed. Checkout abandoned.');
                  addLog('highlight', '[predictive-model] PREDICTION CONFIRMED: Thread exhaustion triggered cascading failure.', { escalate: true });
                  setNodes(prev => ({ ...prev, user: 'critical', payment: 'critical' }));
                  setModels(prev => ({ ...prev, thread: 99, network: 72 }));
                }
              }
            ];

            const timeouts = sequence.map(step => setTimeout(step.action, step.delay));
            return () => timeouts.forEach(clearTimeout);
          }, [isSimulating]);

          const addLog = (type, text, options = {}) => {
            const time = new Date().toLocaleTimeString([], { hour12: false });
            setLogs(prev => [...prev, { id: Date.now() + Math.random(), type, text: `${time} ${text}`, ...options }]);
          };

          const startSimulation = () => {
            setIsSimulating(true);
            setSimulationStep(0);
            setNodes({ api: 'healthy', user: 'healthy', payment: 'healthy', db: 'healthy' });
            setModels({ thread: 2, memory: 1, network: 5 });
            addLog('info', '========================================');
            addLog('highlight', '[system] INITIATING TRAFFIC SPIKE SIMULATION...');
          };

          const resetSimulation = () => {
            setIsSimulating(false);
            setSimulationStep(0);
            setNodes({ api: 'healthy', user: 'healthy', payment: 'healthy', db: 'healthy' });
            setModels({ thread: 2, memory: 1, network: 5 });
            setSelectedNode(null);
            addLog('info', '========================================');
            addLog('success', '[system] System reset to baseline.');
          };

          const getNodeMetrics = (nodeId) => {
            const isWarn = nodes[nodeId] === 'warning';
            const isCrit = nodes[nodeId] === 'critical';
            
            let cpu = '35%';
            let mem = '2.1GB';
            let status = 'Operational';
            let cpuPct = 35;
            let baseCpuPct = 30;

            if (nodeId === 'api') {
              if (isWarn) { cpu = '85%'; mem = '4.5GB'; status = 'High Load'; cpuPct = 85; }
              if (isCrit) { cpu = '99%'; mem = '6.2GB'; status = 'Failing'; cpuPct = 99; }
            } else if (nodeId === 'user') {
              baseCpuPct = 40;
              cpuPct = 45;
              if (isWarn) { cpu = '92%'; mem = '6.8GB'; status = 'Thread Warning'; cpuPct = 92; }
              if (isCrit) { cpu = '100%'; mem = '8.4GB (OOM)'; status = 'Exhausted'; cpuPct = 100; }
            } else if (nodeId === 'db') {
              baseCpuPct = 50;
              cpuPct = 55;
              if (isWarn) { cpu = '65%'; mem = '16GB'; status = 'Connection Wait'; cpuPct = 65; }
            } else if (nodeId === 'payment') {
              baseCpuPct = 20;
              cpuPct = 25;
              if (isCrit) { cpu = '15%'; mem = '1.2GB'; status = 'Upstream Timeout'; cpuPct = 15; }
            }

            return { cpu, mem, status, cpuPct, baseCpuPct };
          };

          return (
            <div className="it-prediction-page">
              <div className="panel-header" style={{ marginBottom: 0 }}>
                <div>
                  <h2 className="panel-title"><i className="fa-solid fa-network-wired" style={{ color: "var(--color-secondary)" }}></i> Infrastructure Topology & Predictive Map</h2>
                  <p className="panel-subtitle">Click nodes to view real-time telemetry. AI models monitor for cascading failures.</p>
                </div>
                <div style={{ display: 'flex', gap: '1rem' }}>
                  {!isSimulating ? (
                    <button className="btn-simulate" onClick={startSimulation}>
                      <i className="fa-solid fa-bolt"></i> Simulate Traffic Spike
                    </button>
                  ) : (
                    <button className="btn-simulate" style={{ borderColor: 'var(--color-success)', color: 'var(--color-success)' }} onClick={resetSimulation}>
                      <i className="fa-solid fa-rotate-left"></i> Reset Architecture
                    </button>
                  )}
                </div>
              </div>

              <div className="grid-2col" style={{ gridTemplateColumns: '1.5fr 1fr', marginBottom: 0 }}>
                <div className="topology-container">
                  <div className={`topology-connection ${simulationStep >= 1 ? 'active' : ''}`} style={{ width: '120px', left: '160px' }}></div>
                  <div className={`topology-connection ${simulationStep >= 3 ? 'critical' : ''}`} style={{ width: '120px', right: '160px', top: '35%' }}></div>
                  <div className={`topology-connection ${simulationStep >= 4 ? 'critical' : ''}`} style={{ width: '120px', right: '160px', top: '65%' }}></div>

                  <div className={`topology-node ${nodes.api}`} onClick={() => setSelectedNode('api')}>
                    <i className="fa-solid fa-globe"></i>
                    <span className="node-label">API Gateway</span>
                  </div>

                  <div className={`topology-node ${nodes.user}`} onClick={() => setSelectedNode('user')}>
                    <i className="fa-solid fa-users-gear"></i>
                    <span className="node-label">User Service</span>
                  </div>

                  <div style={{ display: 'flex', flexDirection: 'column', gap: '2rem' }}>
                    <div className={`topology-node ${nodes.db}`} onClick={() => setSelectedNode('db')}>
                      <i className="fa-solid fa-database"></i>
                      <span className="node-label">DB Cluster</span>
                    </div>
                    <div className={`topology-node ${nodes.payment}`} onClick={() => setSelectedNode('payment')} style={{ position: 'relative' }}>
                      <i className="fa-solid fa-credit-card"></i>
                      <span className="node-label">Payment Gateway</span>
                      
                      {/* Overlay Revenue at Risk */}
                      {(nodes.payment === 'warning' || nodes.payment === 'critical') && (
                        <div className="revenue-risk-badge">
                          Est. Risk: RM 42,500 / hr
                        </div>
                      )}
                    </div>
                  </div>

                  {selectedNode && (
                    <div className="node-details-panel">
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '1rem', borderBottom: '1px solid var(--border-light)', paddingBottom: '0.5rem' }}>
                        <strong>{selectedNode.toUpperCase()} Node</strong>
                        <i className="fa-solid fa-xmark" style={{ cursor: 'pointer', color: 'var(--text-muted)' }} onClick={() => setSelectedNode(null)}></i>
                      </div>
                      <div className="node-metric">
                        <span className="node-metric-label">Status</span>
                        <span className="node-metric-val" style={{ color: nodes[selectedNode] === 'critical' ? 'var(--color-danger)' : nodes[selectedNode] === 'warning' ? 'var(--color-warning)' : 'var(--color-success)' }}>
                          {getNodeMetrics(selectedNode).status}
                        </span>
                      </div>
                      <div className="node-metric">
                        <span className="node-metric-label">CPU Load</span>
                        <span className="node-metric-val">{getNodeMetrics(selectedNode).cpu}</span>
                      </div>
                      <div className="node-metric">
                        <span className="node-metric-label">Memory</span>
                        <span className="node-metric-val">{getNodeMetrics(selectedNode).mem}</span>
                      </div>
                      
                      {/* Historical Baseline Comparison Chart */}
                      <div className="baseline-chart" title="Real-time vs Historical Baseline for this time of day">
                        <div className="chart-col">
                          <div className="chart-bar baseline" style={{ height: `${getNodeMetrics(selectedNode).baseCpuPct}%` }}></div>
                          <span className="chart-label">Base</span>
                        </div>
                        <div className="chart-col">
                          <div className={`chart-bar current ${nodes[selectedNode]}`} style={{ height: `${getNodeMetrics(selectedNode).cpuPct}%` }}></div>
                          <span className="chart-label">Live</span>
                        </div>
                      </div>

                    </div>
                  )}
                </div>

                <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                  <div className="predict-card">
                    <div className="predict-card-header">
                      <span><i className="fa-solid fa-layer-group" style={{ color: 'var(--color-primary)' }}></i> Thread Exhaustion Predictor</span>
                      <span className="predict-card-value" style={{ color: models.thread > 80 ? 'var(--color-danger)' : models.thread > 50 ? 'var(--color-warning)' : 'var(--text-primary)' }}>
                        {models.thread}%
                      </span>
                    </div>
                    <div className="predict-card-desc">Confidence score of impending thread pool crash based on request rates and GC logs.</div>
                  </div>
                  
                  <div className="predict-card">
                    <div className="predict-card-header">
                      <span><i className="fa-solid fa-network-wired" style={{ color: 'var(--color-secondary)' }}></i> Network Partition Classifier</span>
                      <span className="predict-card-value">{models.network}%</span>
                    </div>
                    <div className="predict-card-desc">Probability of service isolation or gateway timeout cascading.</div>
                  </div>

                  <div className="predict-card">
                    <div className="predict-card-header">
                      <span><i className="fa-solid fa-memory" style={{ color: 'var(--color-success)' }}></i> Memory Leak Detector</span>
                      <span className="predict-card-value">{models.memory}%</span>
                    </div>
                    <div className="predict-card-desc">Long-term heap saturation analysis over a 24-hour sliding window.</div>
                  </div>
                </div>
              </div>

              <div className="terminal-container">
                <div className="terminal-header">
                  <span><i className="fa-solid fa-terminal"></i> AegisAI Deep-Log Analysis Feed</span>
                  <span>Log Ingestion: Active</span>
                </div>
                <div>
                  {logs.map(log => (
                    <div key={log.id} className={`log-line ${log.type}`}>
                      {log.text}
                      
                      {/* Explainable AI Tag */}
                      {log.xai && (
                        <span className="xai-tag" title={log.xai}>
                          <i className="fa-solid fa-microchip"></i> Explainable AI Match
                        </span>
                      )}

                      {/* Escalate to Remediation Button */}
                      {log.escalate && (
                        <button 
                          className="btn-escalate" 
                          onClick={() => {
                            if(setActiveTab) setActiveTab('remediation');
                            else window.dispatchEvent(new CustomEvent('navigate', { detail: 'remediation' }));
                          }}
                        >
                          <i className="fa-solid fa-shield-halved"></i> Escalate to Remediation Center
                        </button>
                      )}
                    </div>
                  ))}
                  <div ref={logsEndRef} />
                </div>
              </div>
            </div>
          );
        }

        function FinancialRisk() {
          return (
            <div className="placeholder-page">
              <i className="fa-solid fa-shield-halved placeholder-icon"></i>
              <h2 className="placeholder-title">Financial Risk & Fraud Detection</h2>
              <p className="placeholder-desc">This section is currently under development by a team member. It will feature real-time transaction ingestion and fraud probability metrics.</p>
            </div>
          );
        }

        function Remediation() {
          return (
            <div className="placeholder-page">
              <i className="fa-solid fa-terminal placeholder-icon"></i>
              <h2 className="placeholder-title">Automated Remediation Center</h2>
              <p className="placeholder-desc">This section is currently under development by a team member. It will feature actionable logs, fix triggers, and the Aegis-CLI output terminal.</p>
            </div>
          );
        }

        // ================= Blank Page Placeholders =================
        function HardwareDegradation() {
          return (
            <div className="placeholder-page">
              <i className="fa-solid fa-microchip placeholder-icon"></i>
              <h2 className="placeholder-title">Hardware Degradation & Fault Ingestion</h2>
              <p className="placeholder-desc">This section is currently under development by a team member. It will feature hardware component diagnostics, CPU/RAM wear telemetry, and simulated fault injection tests.</p>
            </div>
          );
        }

        // ================= Settings Component =================
        function Settings({ theme, setTheme }) {
          const [alertsEnabled, setAlertsEnabled] = useState(true);
          const [refreshInterval, setRefreshInterval] = useState('2.5s');
          const [isSaved, setIsSaved] = useState(false);

          const handleSave = (e) => {
            e.preventDefault();
            setIsSaved(true);
            setTimeout(() => setIsSaved(false), 3000);
          };

          return (
            <div className="card-panel" style={{ maxWidth: '600px', margin: '0 auto' }}>
              <div className="panel-header">
                <div>
                  <h3 className="panel-title">
                    <i className="fa-solid fa-sliders" style={{ color: 'var(--color-primary)' }}></i> AegisAI System Settings
                  </h3>
                  <p className="panel-subtitle">Configure application thresholds, monitoring intervals, and UI themes</p>
                </div>
              </div>

              <form className="settings-form" onSubmit={handleSave}>
                <div className="form-group">
                  <label className="form-label">Application Interface Theme</label>
                  <div 
                    className={`form-control-toggle ${theme === 'light' ? 'active' : ''}`}
                    onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                  >
                    <div className="form-toggle-switch"></div>
                    <span className="form-toggle-label">
                      {theme === 'dark' ? 'Dark Theme (Active)' : 'Light Theme (Active)'}
                    </span>
                  </div>
                </div>

                <div className="form-group">
                  <label className="form-label">Telemetry Alert Ingestion</label>
                  <div 
                    className={`form-control-toggle ${alertsEnabled ? 'active' : ''}`}
                    onClick={() => setAlertsEnabled(!alertsEnabled)}
                  >
                    <div className="form-toggle-switch"></div>
                    <span className="form-toggle-label">
                      {alertsEnabled ? 'Predictive Warnings Enabled' : 'Predictive Warnings Muted'}
                    </span>
                  </div>
                </div>

                <div className="form-group">
                  <label className="form-label">Telemetry Sampling Interval</label>
                  <select 
                    className="form-select"
                    value={refreshInterval}
                    onChange={(e) => setRefreshInterval(e.target.value)}
                  >
                    <option value="1s">High Frequency (1.0s ticks)</option>
                    <option value="2.5s">Standard (2.5s ticks)</option>
                    <option value="5s">Eco-Mode (5.0s ticks)</option>
                  </select>
                </div>

                <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', marginTop: '0.5rem' }}>
                  <button type="submit" className="btn-submit">Save Settings</button>
                  {isSaved && (
                    <span style={{ color: 'var(--color-success)', fontSize: '0.85rem', fontWeight: '600', animation: 'fadeIn 0.3s ease' }}>
                      <i className="fa-solid fa-circle-check"></i> Configurations saved!
                    </span>
                  )}
                </div>
              </form>
            </div>
          );
        }

        // ================= Core App Wrapper =================
        function App() {
          const [activeTab, setActiveTab] = useState('overview');
          const [timestamp, setTimestamp] = useState('');
          const [theme, setTheme] = useState('dark');
          const [showNotifications, setShowNotifications] = useState(false);
          
          const bellRef = useRef(null);

          const [alerts, setAlerts] = useState([
            {
              id: 'alert-init',
              type: 'success',
              tag: 'System',
              time: 'Just Now',
              title: 'Predictive Engine Initiated',
              desc: 'Ingesting server logs and telemetry streams successfully.',
              xai: 'Predictive modules successfully registered. Listening to microservices CPU, IOPS, and network queues.',
              expanded: false
            }
          ]);

          useEffect(() => {
            if (theme === 'light') {
              document.body.classList.add('light-theme');
            } else {
              document.body.classList.remove('light-theme');
            }
          }, [theme]);

          useEffect(() => {
            function handleClickOutside(event) {
              if (bellRef.current && !bellRef.current.contains(event.target)) {
                setShowNotifications(false);
              }
            }
            document.addEventListener('mousedown', handleClickOutside);
            return () => document.removeEventListener('mousedown', handleClickOutside);
          }, []);

          useEffect(() => {
            const updateTime = () => {
              const current = new Date();
              setTimestamp(current.toISOString().replace('T', ' ').substring(0, 19) + ' UTC');
            };
            updateTime();
            const interval = setInterval(updateTime, 1000);
            return () => clearInterval(interval);
          }, []);

          const getPageTitle = () => {
            switch (activeTab) {
              case 'overview': return 'System Overview Dashboard';
              case 'it-prediction': return 'IT Incident Prediction';
              case 'financial-risk': return 'Financial Risk & Fraud';
              case 'remediation': return 'Automated Remediation';
              case 'hardware-degradation': return 'Hardware Degradation';
              case 'settings': return 'System Settings';
              default: return 'Dashboard';
            }
          };

          const activeAlertsCount = alerts.filter(a => a.type === 'danger').length;

          return (
            <div className="app-container">
              <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} />
              <main className="main-content">
                <header className="top-nav">
                  <h1 className="page-title">{getPageTitle()}</h1>
                  <div className="nav-actions">
                    <div className="live-time">{timestamp}</div>
                    
                    {/* Bell Icon dropdown wrapper */}
                    <div className="alert-bell" ref={bellRef}>
                      <i 
                        className="fa-solid fa-bell" 
                        onClick={() => setShowNotifications(!showNotifications)}
                        style={{ cursor: 'pointer' }}
                      ></i>
                      {activeAlertsCount > 0 && (
                        <span 
                          className="badge-count" 
                          onClick={() => setShowNotifications(!showNotifications)}
                          style={{ cursor: 'pointer' }}
                        >
                          {activeAlertsCount}
                        </span>
                      )}

                      {/* Dropdown Menu */}
                      {showNotifications && (
                        <div className="notifications-dropdown" onClick={(e) => e.stopPropagation()}>
                          <div className="dropdown-header">
                            <span>Notifications</span>
                            {alerts.length > 0 && (
                              <button 
                                className="dropdown-clear-btn"
                                onClick={() => {
                                  setAlerts([]);
                                  setShowNotifications(false);
                                }}
                              >
                                Clear All
                              </button>
                            )}
                          </div>
                          <div className="dropdown-list">
                            {alerts.length === 0 ? (
                              <div className="dropdown-empty">
                                <i className="fa-regular fa-bell-slash" style={{ fontSize: '1.5rem', marginBottom: '0.25rem' }}></i>
                                <span>No new notifications</span>
                              </div>
                            ) : (
                              alerts.map(alert => (
                                <div key={alert.id} className="dropdown-item">
                                  <div className={`dropdown-item-icon ${alert.type === 'danger' ? 'danger' : alert.type === 'warning' ? 'warning' : 'success'}`}>
                                    <i className={
                                      alert.type === 'danger' 
                                        ? 'fa-solid fa-circle-exclamation' 
                                        : alert.type === 'warning' 
                                          ? 'fa-solid fa-triangle-exclamation' 
                                          : 'fa-solid fa-circle-check'
                                    }></i>
                                  </div>
                                  <div className="dropdown-item-content">
                                    <span className="dropdown-item-title">{alert.title}</span>
                                    <span className="dropdown-item-desc" dangerouslySetInnerHTML={{ __html: alert.desc }}></span>
                                    <span className="dropdown-item-time">{alert.time}</span>
                                  </div>
                                </div>
                              ))
                            )}
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </header>
                <div className="content-body">
                  {activeTab === 'overview' && <Overview alerts={alerts} setAlerts={setAlerts} />}
                  {activeTab === 'it-prediction' && <ITPrediction setActiveTab={setActiveTab} />}
                  {activeTab === 'financial-risk' && <FinancialRisk />}
                  {activeTab === 'remediation' && <Remediation />}
                  {activeTab === 'hardware-degradation' && <HardwareDegradation />}
                  {activeTab === 'settings' && <Settings theme={theme} setTheme={setTheme} />}
                </div>
              </main>
            </div>
          );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
